name: CI Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend-test:
    name: Backend Unit & Contract Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: crescendo_ci
          POSTGRES_USER: crescendo_ci
          POSTGRES_PASSWORD: crescendo_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U crescendo_ci -d crescendo_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'
      - name: Run Backend Tests
        env:
          SPRING_PROFILES_ACTIVE: ci
          CREDENTIALS_CRYPTO_KEY: dGVzdGtleXRlc3RrZXl0ZXN0a2V5dGVzdGtleXRlc3Q=
          JWT_SECRET: Y2ktb25seS1qd3Qtc2lnbmluZy1rZXktZm9yLW9wZW5hcGktZ2VuZXJhdGlvbi0zMmJ5dGVzLW1pbmltdW0=
        run: |
          chmod +x mvnw
          cp src/main/resources/application-ci.properties src/main/resources/application.properties
          ./mvnw -q test -Dspring.profiles.active=ci
        working-directory: crescendo-backend

  frontend-test:
    name: Frontend Vitest Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: crescendo-frontend/package-lock.json
      - name: Install Dependencies
        run: npm ci
        working-directory: crescendo-frontend
      - name: Run Vitest Suite
        run: npm test -- --run
        working-directory: crescendo-frontend
      - name: Build Production Bundle
        run: npm run build
        working-directory: crescendo-frontend

  aiml-test:
    name: AI & ML Service Verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: crescendo-aiml/requirements.txt
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
        working-directory: crescendo-aiml
      - name: Verify Service Compilation
        run: |
          find app -name "*.py" -exec python -m py_compile {} +
        working-directory: crescendo-aiml

