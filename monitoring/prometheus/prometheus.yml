global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

scrape_configs:
  - job_name: 'crescendo-backend'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['crescendo-backend:8080']
        labels:
          application: 'Crescendo Automation Engine'
