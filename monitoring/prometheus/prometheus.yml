global:
  scrape_interval: 5s
  evaluation_interval: 5s
  scrape_timeout: 4s

scrape_configs:
  - job_name: 'crescendo-backend-local-ide'
    metrics_path: '/actuator/prometheus'
    static_configs:
      # Primarily scrapes localhost/IDE when running app on Windows host
      - targets: ['host.docker.internal:8080', 'crescendo-backend:8080']
        labels:
          application: 'Crescendo Automation Engine'
